<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <!-- 이 파일은 굉장히 중요하므로 안 꾸몃다 -->
    <form th:action="@{/auth/login}" th:method="POST">
        <label>아이디 : </label>
        <!-- name 이라는 속성 매우 중요하다. -->
        <input type="text" id="user" name="user"/>
        <br>
        <label>비밀번호 : </label>
        <input type="password" id="pass" name="pass"/>
        <br>
        <label>
            <input type="checkbox" id="remember-me" name="remember-me"/>
            이 컴퓨터에서 ID 기억하기
        </label>
        <br>
        <button>로그인</button>
    </form>
</body>
</html>
